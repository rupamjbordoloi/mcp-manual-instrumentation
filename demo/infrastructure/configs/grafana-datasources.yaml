apiVersion: 1

datasources:
  # Prometheus Configuration
  - name: Prometheus
    type: prometheus
    uid: prometheus            # needed so Tempo's datasourceUid: prometheus resolves
    access: proxy
    url: http://prometheus:9090
    editable: true
    allowUiUpdates: false
    jsonData:
      version: 2
      exemplarTraceIdDestinations:
        # Links the traceID from your metrics to the Tempo data source
        - datasourceUid: tempo
          name: traceID

  # Tempo Configuration
  - name: Tempo
    type: tempo
    uid: tempo                 # needed so Prometheus's datasourceUid: tempo resolves
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: true
    allowUiUpdates: false
    jsonData:
      version: 2
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        # Updated to the current stable HTTP semconv attribute names, as
        # actually emitted by otelhttp 0.71.0 (confirmed via the collector's
        # debug exporter): http.request.method / http.response.status_code.
        # The old http.target / http.status_code / http.method names are from
        # the pre-2023 unstable semconv and are no longer produced.
        tags:
          - key: http.request.method
            value: http_request_method
          - key: http.response.status_code
            value: http_response_status_code
        queries:
          - name: 'View Request Rate'
            # otel_ prefix comes from the collector's prometheus exporter
            # namespace: "otel" (see otel-collector-config.yaml). Metric name
            # itself is the current stable semconv name,
            # http.server.request.duration (seconds), not the old
            # http.server.duration (milliseconds).
            query: 'sum(rate(otel_http_server_request_duration_seconds_count{$__tags}[1m]))'
      # trace -> logs correlation
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true

  # Loki Configuration
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    allowUiUpdates: false
    jsonData:
      derivedFields:
        # Makes a trace_id found in a log line clickable, jumping to that
        # trace in Tempo. Requires your app to emit trace_id as a log field
        # (it will, if logs go through the OTel Logs SDK/otelslog bridge).
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"(\w+)"'
          name: TraceID
          url: '$${__value.raw}'