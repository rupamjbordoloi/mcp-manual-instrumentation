  # Tempo Backend (Traces)
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml", "-target=all" ]
    volumes:
      - ./library/configs/tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo UI/API
  
  # Grafana Frontend (Visualization)
  grafana:
    image: grafana/grafana:13.0.1@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./library/configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      # - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      # - prometheus
      - tempo