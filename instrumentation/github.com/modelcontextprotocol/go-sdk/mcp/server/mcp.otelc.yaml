mcp_server_call_tool:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: callTool
    recv: "*Server"
  do:
    - inject_hooks:
        before: BeforeCallTool
        after: AfterCallTool
        path: "github.hdfcbank.com/HDFCBANK/ps-otel/instrumentation/github.com/modelcontextprotocol/go-sdk/mcp/server"

mcp_server_new_server:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: NewServer
  do:
    - inject_hooks:
        after: AfterNewServer
        path: "github.hdfcbank.com/HDFCBANK/ps-otel/instrumentation/github.com/modelcontextprotocol/go-sdk/mcp/server"

# (*Server).Connect returns a new *mcp.ServerSession per inbound client
# connection (unlike NewServer, which runs once for the whole process) —
# the server-side symmetric counterpart to the client's mcp_client_connect.
# Used to time mcp.session.duration (see hook_metrics.go).
mcp_server_connect:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: Connect
    recv: "*Server"
  do:
    - inject_hooks:
        before: BeforeServerConnect
        after: AfterServerConnect
        path: "github.hdfcbank.com/HDFCBANK/ps-otel/instrumentation/github.com/modelcontextprotocol/go-sdk/mcp/server"

# Symmetric counterpart to mcp_server_connect / the client's
# mcp_client_close: records mcp.session.duration when the session
# this rule paired with mcp_server_connect actually ends.
mcp_server_session_close:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: Close
    recv: "*ServerSession"
  do:
    - inject_hooks:
        before: BeforeServerSessionClose
        after: AfterServerSessionClose
        path: "github.hdfcbank.com/HDFCBANK/ps-otel/instrumentation/github.com/modelcontextprotocol/go-sdk/mcp/server"

# Records every tool name registered on a server. Client-supplied tool names
# are only used as metric attributes when they match a registered tool,
# which keeps mcp.tool.* metric cardinality bounded. The generic mcp.AddTool
# calls this method, so one rule covers both registration paths.
mcp_server_add_tool:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: AddTool
    recv: "*Server"
  do:
    - inject_hooks:
        before: BeforeServerAddTool
        after: AfterServerAddTool
        path: "github.hdfcbank.com/HDFCBANK/ps-otel/instrumentation/github.com/modelcontextprotocol/go-sdk/mcp/server"

# Outer HTTP handler: sees every request, including ones rejected before they
# reach a session. Feeds mcp.transport.errors.total and mcp.message.size.
# (mcp_server_streamable_http_request below hooks the inner per-session
# transport for trace-context bridging instead.)
mcp_server_transport_request:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: ServeHTTP
    recv: "*StreamableHTTPHandler"
  do:
    - inject_hooks:
        before: BeforeTransportRequest
        after: AfterTransportRequest
        path: "github.hdfcbank.com/HDFCBANK/ps-otel/instrumentation/github.com/modelcontextprotocol/go-sdk/mcp/server"

# BeforeStreamableHTTP bridges the current HTTP server span into the
# JSON-RPC request (see hook.go); serverProtocolMiddleware depends on that
# bridge to correctly parent tools/call under its own HTTP request instead
# of falling back to whatever session-level context is ambient.
#
# ServeHTTP runs once per inbound HTTP request (unlike NewStreamableHTTPHandler,
# which only runs once per process), so this is the correct target for a
# per-request hook. Only "before" is wired: AfterStreamableHTTP would need a
# *mcp.StreamableHTTPHandler param, which belongs to NewStreamableHTTPHandler's
# return value, not to ServeHTTP.
mcp_server_streamable_http_request:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: ServeHTTP
    recv: "*StreamableServerTransport"
  do:
    - inject_hooks:
        before: BeforeStreamableHTTP
        path: "github.hdfcbank.com/HDFCBANK/ps-otel/instrumentation/github.com/modelcontextprotocol/go-sdk/mcp/server"

# Wraps the MCP handler with otelhttp for HTTP server metrics only. otelhttp
# also does tracing work by default, so it is told not to:
#
#   WithTracerProvider(noop...)  stops it creating spans.
#   WithPropagators(<empty>)     stops it extracting the incoming traceparent
#                                into the request context. Left on, that
#                                replaces the HTTP server span otelc started
#                                with the client's span. BeforeStreamableHTTP
#                                bridges the span in that context, so the MCP
#                                span would become a sibling of the HTTP server
#                                span instead of its child.
http_metrics_wrap:
  target: "**"
  where:
    function_call: github.com/modelcontextprotocol/go-sdk/mcp.NewStreamableHTTPHandler
  do:
    - wrap_call:
        replace: |-
          otelhttp.NewHandler({{ . }}, "mcp", otelhttp.WithTracerProvider(noop.NewTracerProvider()), otelhttp.WithPropagators(propagation.NewCompositeTextMapPropagator()))
  imports:
    otelhttp: "go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp"
    noop: "go.opentelemetry.io/otel/trace/noop"
    propagation: "go.opentelemetry.io/otel/propagation"