mcp_client_new_client:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: NewClient
  do:
    - inject_hooks:
        after: AfterNewClient
        path: "library/client"

mcp_client_connect:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: Connect
    recv: "*Client"
  do:
    - inject_hooks:
        before: BeforeConnect
        after: AfterConnect
        path: "library/client"

mcp_client_close:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: Close
    recv: "*ClientSession"
  do:
    - inject_hooks:
        before: BeforeClose
        after: AfterClose
        path: "library/client"

mcp_client_shutdown_on_exit:
  target: main
  where:
    func: main
  do:
    - inject_hooks:
        after: AfterMain
        path: "library/client"