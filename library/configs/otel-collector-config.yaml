receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: "otel"
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # NEW: logs -> Loki, via Loki's native OTLP ingestion endpoint (Loki 3.x+)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    # NEW
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
