global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Scrapes the OTel Collector's Prometheus exporter (see
  # otel-collector-config.yaml -> exporters.prometheus, endpoint 0.0.0.0:8889).
  # This is where otel_go_* (runtime) and otel_http_server_* (HTTP) metrics
  # both land, since both go through the same Collector metrics pipeline.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']