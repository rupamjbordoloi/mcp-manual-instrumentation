# Exports log/slog records through the otelslog bridge. Applies only to
# applications that use log/slog.
hook_slog_log:
  target: log/slog
  where:
    func: log
    recv: "*Logger"
  do:
    - inject_hooks:
        before: BeforeSlogLog
        path: "library/logging/slog"

hook_slog_log_attrs:
  target: log/slog
  where:
    func: logAttrs
    recv: "*Logger"
  do:
    - inject_hooks:
        before: BeforeSlogLogAttrs
        path: "library/logging/slog"