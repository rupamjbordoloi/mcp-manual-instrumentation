# Exports zap entries through the otelzap bridge. Applies only to
# applications that use go.uber.org/zap.
hook_zap_check:
  target: go.uber.org/zap
  where:
    func: check
    recv: "*Logger"
  do:
    - inject_hooks:
        before: BeforeCheck
        after: AfterCheck
        path: "library/logging/zap"