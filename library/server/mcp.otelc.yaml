mcp_server_call_tool:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: callTool
    recv: "*Server"
  do:
    - inject_hooks:
        before: BeforeCallTool
        after: AfterCallTool
        path: "library/server"

mcp_server_new_server:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: NewServer
  do:
    - inject_hooks:
        after: AfterNewServer
        path: "library/server"

mcp_server_streamable_http:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: ServeHTTP
    recv: "*StreamableServerTransport"
  do:
    - inject_hooks:
        before: BeforeStreamableHTTP
        path: "library/server"

mcp_server_shutdown_on_exit:
  target: main
  where:
    func: main
  do:
    - inject_hooks:
        after: AfterMain
        path: "library/server"