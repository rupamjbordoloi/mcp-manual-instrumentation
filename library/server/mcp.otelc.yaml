mcp_server_call_tool:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: callTool
    recv: "*Server"
  do:
    - inject_hooks:
        before: BeforeCallTool
        after: AfterCallTool
        path: "library/server"

mcp_server_new_server:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: NewServer
  do:
    - inject_hooks:
        after: AfterNewServer
        path: "library/server"

# (*Server).Connect returns a new *mcp.ServerSession per inbound client
# connection (unlike NewServer, which runs once for the whole process) —
# the server-side symmetric counterpart to the client's mcp_client_connect.
# Used to time mcp.server.session.duration (see hook.go).
mcp_server_connect:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: Connect
    recv: "*Server"
  do:
    - inject_hooks:
        before: BeforeServerConnect
        after: AfterServerConnect
        path: "library/server"

# Symmetric counterpart to mcp_server_connect / the client's
# mcp_client_close: records mcp.server.session.duration when the session
# this rule paired with mcp_server_connect actually ends.
mcp_server_session_close:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: Close
    recv: "*ServerSession"
  do:
    - inject_hooks:
        before: BeforeServerSessionClose
        after: AfterServerSessionClose
        path: "library/server"

# BeforeStreamableHTTP bridges the current HTTP server span into the
# JSON-RPC request (see hook.go); serverProtocolMiddleware depends on that
# bridge to correctly parent tools/call under its own HTTP request instead
# of falling back to whatever session-level context is ambient.
#
# ServeHTTP runs once per inbound HTTP request (unlike NewStreamableHTTPHandler,
# which only runs once per process), so this is the correct target for a
# per-request hook. Only "before" is wired: AfterStreamableHTTP would need a
# *mcp.StreamableHTTPHandler param, which belongs to NewStreamableHTTPHandler's
# return value, not to ServeHTTP.
mcp_server_streamable_http_request:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: ServeHTTP
    recv: "*StreamableServerTransport"
  do:
    - inject_hooks:
        before: BeforeStreamableHTTP
        path: "library/server"

# Wraps the MCP handler with otelhttp for HTTP server metrics only
# (WithTracerProvider(noop...) disables otelhttp's own span creation, since
# tracing already comes from mcp_server_streamable_http_request above).
http_metrics_wrap:
  target: $root
  where:
    function_call: github.com/modelcontextprotocol/go-sdk/mcp.NewStreamableHTTPHandler
  do:
    - wrap_call:
        replace: |-
          otelhttp.NewHandler({{ . }}, "mcp", otelhttp.WithTracerProvider(noop.NewTracerProvider()))
  imports:
    otelhttp: "go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp"
    noop: "go.opentelemetry.io/otel/trace/noop"