mcp_server_call_tool:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: callTool
    recv: "*Server"
  do:
    - inject_hooks:
        before: BeforeCallTool
        after: AfterCallTool
        path: "library/server"

mcp_server_new_server:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: NewServer
  do:
    - inject_hooks:
        after: AfterNewServer
        path: "library/server"

