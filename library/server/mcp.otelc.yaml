http_metrics_wrap:
  target: $root
  where:
    function_call: github.com/modelcontextprotocol/go-sdk/mcp.NewStreamableHTTPHandler
  do:
    - wrap_call:
        replace: |-
          otelhttp.NewHandler(func() http.Handler {
          	fmt.Println("[otelc] http_metrics_wrap: wrapping MCP handler with otelhttp for HTTP metrics")
          	return {{ . }}
          }(), "mcp", otelhttp.WithTracerProvider(noop.NewTracerProvider()))
  imports:
    otelhttp: "go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp"
    noop: "go.opentelemetry.io/otel/trace/noop"
    fmt: "fmt"